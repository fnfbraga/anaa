<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="ANAA" />
		<meta name="description" content="ANAA — Another Nice Authentication App for encrypted logins and secure notes." />
		<link rel="manifest" crossorigin="use-credentials" href="/manifest.json" />
		<title>ANAA — Vault</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('anaa-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (stored === 'dark' || (!stored && prefersDark)) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-background text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
